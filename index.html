<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Tugas Saya</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main>
      <div class="top">
        <h1>📋 Tugas Saya</h1>
        <span style="display: flex; gap: 6px"
          ><button onclick="openBackup()">⇅ Cadangan</button
          ><button class="pri" onclick="openForm()">
            + Tambah tugas
          </button></span
        >
      </div>
      <div class="sub" id="sum"></div>
      <div class="bar">
        <select id="fT" onchange="render()">
          <option value="">Semua jenis</option>
          <option value="weekly">Mingguan</option>
          <option value="once">Sekali saja</option>
        </select>
        <select id="fC" onchange="render()"></select>
        <select id="fS" onchange="render()">
          <option value="">Semua status</option>
          <option>Belum</option>
          <option>Proses</option>
          <option>Diblokir</option>
          <option>Selesai</option>
        </select>
      </div>
      <div id="list"></div>

      <dialog id="dlg">
        <b id="dt">Tugas baru</b>
        <label>Nama tugas</label><input id="fTitle" /> <label>Jenis</label
        ><select id="fType">
          <option value="once">Sekali saja</option>
          <option value="weekly">Mingguan (reset tiap Senin)</option>
        </select>
        <label>Kategori</label
        ><input
          id="fCat"
          list="cats"
          placeholder="mis. Kuliah, Lab, Asdos"
        /><datalist id="cats"></datalist> <label>Prioritas</label
        ><select id="fPrio">
          <option>Wajib</option>
          <option>Sedang</option>
          <option>Aman</option>
        </select>
        <label>Status</label
        ><select id="fSt">
          <option>Belum</option>
          <option>Proses</option>
          <option>Diblokir</option>
          <option>Selesai</option>
        </select>
        <label>Batas waktu (opsional)</label><input type="date" id="fDue" />
        <label>Catatan</label><textarea id="fNote" rows="2"></textarea>
        <div
          style="
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
          "
        >
          <button onclick="dlg.close()">Batal</button
          ><button class="pri" onclick="save()">Simpan</button>
        </div>
      </dialog>
      <dialog id="dlg2">
        <b>Cadangan &amp; pindah data</b>
        <div class="note" style="margin: 6px 0">
          Di perangkat asal: tekan <b>Salin data</b>, lalu kirim teksnya ke diri
          sendiri (WhatsApp/email). Di perangkat tujuan: tempel teks di kotak
          ini, lalu tekan <b>Muat data</b>.
        </div>
        <textarea id="bk" rows="6" placeholder="Tempel data di sini"></textarea>
        <div class="note" id="bkMsg" style="margin-top: 6px"></div>
        <div
          style="
            display: flex;
            gap: 8px;
            justify-content: flex-end;
            margin-top: 12px;
            flex-wrap: wrap;
          "
        >
          <button onclick="dlg2.close()">Tutup</button
          ><button onclick="bkCopy()">Salin data</button
          ><button class="pri" onclick="bkLoad()">Muat data</button>
        </div>
      </dialog>
    </main>
    <script src="./main.js"></script>
  </body>
</html>
